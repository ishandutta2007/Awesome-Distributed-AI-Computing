<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
      <animate attributeName="x1" values="0%;100%;0%" dur="12s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;200%;100%" dur="12s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .font-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      letter-spacing: 0.3px;
    }
    .font-pill {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.8px;
    }
    .data-flow {
      stroke-dasharray: 8 12;
      animation: flowAnim 4s linear infinite;
    }
    @keyframes flowAnim {
      to {
        stroke-dashoffset: -40;
      }
    }
    .pulse-node {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { r: 5; opacity: 0.6; }
      100% { r: 8; opacity: 1; }
    }
    .float-badge {
      animation: float 5s ease-in-out infinite alternate;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-4px); }
    }
  </style>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Constellation Network (Background Layer) -->
  <g opacity="0.45" filter="url(#glow)">
    <!-- Network Lines -->
    <line x1="80" y1="60" x2="260" y2="120" stroke="#38bdf8" stroke-width="1.5" class="data-flow" />
    <line x1="260" y1="120" x2="180" y2="280" stroke="#818cf8" stroke-width="1.2" class="data-flow" />
    <line x1="180" y1="280" x2="380" y2="220" stroke="#6366f1" stroke-width="1.5" class="data-flow" />
    <line x1="1020" y1="80" x2="880" y2="150" stroke="#c084fc" stroke-width="1.5" class="data-flow" />
    <line x1="880" y1="150" x2="1080" y2="240" stroke="#38bdf8" stroke-width="1.2" class="data-flow" />
    <line x1="1080" y1="240" x2="940" y2="300" stroke="#06b6d4" stroke-width="1.5" class="data-flow" />
    <line x1="260" y1="120" x2="500" y2="70" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" opacity="0.6" />
    <line x1="700" y1="70" x2="880" y2="150" stroke="#a855f7" stroke-width="1" stroke-dasharray="4 6" opacity="0.6" />

    <!-- Animated Compute Nodes -->
    <circle cx="80" cy="60" r="6" fill="#38bdf8" class="pulse-node" />
    <circle cx="260" cy="120" r="7" fill="#818cf8" class="pulse-node" style="animation-delay: 0.6s;" />
    <circle cx="180" cy="280" r="6" fill="#6366f1" class="pulse-node" style="animation-delay: 1.2s;" />
    <circle cx="380" cy="220" r="5" fill="#38bdf8" class="pulse-node" style="animation-delay: 1.8s;" />
    <circle cx="1020" cy="80" r="6" fill="#c084fc" class="pulse-node" style="animation-delay: 0.4s;" />
    <circle cx="880" cy="150" r="8" fill="#38bdf8" class="pulse-node" style="animation-delay: 1s;" />
    <circle cx="1080" cy="240" r="6" fill="#06b6d4" class="pulse-node" style="animation-delay: 1.6s;" />
    <circle cx="940" cy="300" r="7" fill="#a855f7" class="pulse-node" style="animation-delay: 2.2s;" />
  </g>

  <!-- Ambient Central Halo behind text -->
  <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.18" />
    <stop offset="60%" stop-color="#0f172a" stop-opacity="0.05" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0" />
  </radialGradient>
  <ellipse cx="600" cy="180" rx="420" ry="140" fill="url(#centerGlow)" />

  <!-- Accent Divider Line -->
  <rect x="360" y="215" width="480" height="2" rx="1" fill="url(#accentLine)" />

  <!-- Primary Foreground Content -->
  <!-- Top Category Chip -->
  <g class="float-badge">
    <rect x="475" y="45" width="250" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="493" cy="60" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="510" y="65" fill="#94a3b8" class="font-pill">DISTRIBUTED AI ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <g>
    <text x="600" y="145" text-anchor="middle" fill="url(#titleGrad)" class="font-title" filter="url(#glow)">Awesome Distributed AI Computing</text>
  </g>

  <!-- Subtitle -->
  <g>
    <text x="600" y="195" text-anchor="middle" fill="#cbd5e1" class="font-sub">
      Scalable ML Training &#x2022; Cluster Orchestration &#x2022; Ray, Spark &amp; High-Throughput AI Fabrics
    </text>
  </g>

  <!-- Interactive / Modern Spec Pills (Foreground) -->
  <g transform="translate(0, 240)">
    <!-- Pill 1: Multi-GPU Training -->
    <g transform="translate(260, 0)">
      <rect width="185" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <text x="92" y="22" text-anchor="middle" fill="#38bdf8" class="font-pill">&#x26A1; MULTI-GPU TRAINING</text>
    </g>

    <!-- Pill 2: Cluster Orchestration -->
    <g transform="translate(460, 0)">
      <rect width="210" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <text x="105" y="22" text-anchor="middle" fill="#818cf8" class="font-pill">&#x2699; CLUSTER ORCHESTRATION</text>
    </g>

    <!-- Pill 3: Distributed Inference -->
    <g transform="translate(685, 0)">
      <rect width="195" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <text x="97" y="22" text-anchor="middle" fill="#c084fc" class="font-pill">&#x1F680; HIGH-THROUGHPUT LLM</text>
    </g>
  </g>

  <!-- Bottom Border Highlight -->
  <rect x="0" y="357" width="1200" height="3" fill="url(#accentLine)" />
</svg>
