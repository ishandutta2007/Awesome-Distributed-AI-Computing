<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="40%" stop-color="#818cf8"/><stop offset="80%" stop-color="#c084fc"/><stop offset="100%" stop-color="#38bdf8"/><animate attributeName="x1" dur="12s" repeatCount="indefinite" values="0%;100%;0%"/><animate attributeName="x2" dur="12s" repeatCount="indefinite" values="100%;200%;100%"/></linearGradient><linearGradient id="accentLine" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/><stop offset="50%" stop-color="#6366f1" stop-opacity=".9"/><stop offset="100%" stop-color="#d946ef" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".4" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulse{0%{r:5;opacity:.6}}@keyframes float{0%{transform:translateY(0)}}.font-pill,.font-sub,.font-title{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.font-title{font-weight:800;font-size:44px;letter-spacing:-.5px}.font-sub{font-weight:400;font-size:17px;letter-spacing:.3px}.font-pill{font-weight:600;font-size:12px;letter-spacing:.8px}.data-flow{stroke-dasharray:8 12;animation:flowAnim 4s linear infinite}.pulse-node{animation:pulse 3s ease-in-out infinite alternate}.float-badge{animation:float 5s ease-in-out infinite alternate}</style><rect width="1